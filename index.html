function crashAnim(target,o){return new Promise(res=>{const stg=$('#cr'),rk=$('#rk'),mt=$('#crm'),cash=$('#cash'),won=o.cp>=target,lm=Math.log(Math.max(o.cp,target)*1.25),T=Math.max(1100,Math.min(3800,900+Math.log(o.cp)*900)),t0=performance.now();let last=0,cashed=false;
 const ln=document.createElement('div');ln.className='tgt';ln.style.bottom=(8+Math.log(target)/lm*68)+'%';ln.textContent='Target '+target+'x';stg.appendChild(ln);
 const f=t=>{const k=Math.min(1,(t-t0)/T),m=Math.pow(o.cp,k),p=Math.log(m)/lm,x=(8+p*80)+'%',y=(8+p*68)+'%';mt.textContent=m.toFixed(2)+'x';rk.style.left=x;rk.style.bottom=y;
  if(t-last>55){last=t;const d=document.createElement('i');d.className='dot';d.style.left=x;d.style.bottom=y;stg.appendChild(d);setTimeout(()=>d.remove(),700)}
  if(!cashed&&won&&m>=target){cashed=true;cash.style.opacity=1;cash.textContent='✓ Cashed out at '+target+'x'}
  if(k<1)requestAnimationFrame(f);else{rk.textContent='💥';rk.classList.add('boom');mt.style.color='#ff5c5c';setTimeout(res,700)}};
 requestAnimationFrame(f)})}

 if(at==='us')h+=`<div class="card"><div class="sec"><h2>Players</h2><span class="mu" id="ucount">${DB.users.length} players</span></div><div class="fld" style="margin-top:8px"><input id="usearch" type="search" placeholder="Search by username, phone, email or ID" value="${E(uq)}" oninput="searchUsers(this.value)" autocomplete="off"></div><div id="ulist">${usersList()}</div></div>`;
 if(at==='rq')h+=`<div class="card"><h2>Recharge requests</h2>${DB.reqs.length?`<div class="list">${DB.reqs.map(r=>{const u=DB.users.find(x=>x.id===r.uid);return`<div class="item"><div class="grow"><b>${E(u?uname(u):'?')}</b><div class="mu">${when(r.t)}</div></div><span class="pill">🪙 ${r.c.toLocaleString()}</span><b class="${r.s==='approved'?'ok':r.s==='rejected'?'no':''}">${r.s}</b>${r.s==='pending'?`<div class="acts"><button class="p sm" onclick="dec('${r.id}',1)">Approve</button><button class="sm d" onclick="dec('${r.id}',0)">Reject</button></div>`:''}</div>`}).join('')}</div>`:'<p class="mu">No requests yet.</p>'}</div>`;
 if(at==='gm')h+=`<div class="card"><h2>Win chance (all games)</h2><p class="mu">Win chance is how often a player wins a round, from 1 to 100%. Natural means the normal odds.</p><div class="row"><input type="range" id="wa" min="1" max="100" value="50" style="flex:1;min-width:140px" oninput="document.getElementById('wal').textContent=this.value+'%'"><span id="wal" class="pill">50%</span><button class="p" onclick="wpAll($('#wa').value)">Apply to all</button><button onclick="wpAll(null)">All natural</button></div></div>
 <div class="list">${G.map(g=>{const c=DB.cfg.games[g.id],w=c.wp;return`<div class="card" style="margin:0"><div class="sec"><h3>${g.ic} ${g.n}</h3><button class="${c.on?'on':''}" onclick="tg('${g.id}')">${c.on?'On':'Off'}</button></div><div class="row"><span class="mu">Max bet</span><input type="number" style="max-width:110px" value="${c.max}" onchange="mx('${g.id}',this.value)" aria-label="Max bet"></div><div class="row"><span class="mu">Win chance</span><input type="range" min="1" max="100" value="${w==null?50:w}" style="flex:1;min-width:130px" aria-label="Win chance" oninput="wpLbl('${g.id}',this.value)" onchange="wpSet('${g.id}',this.value)"><span id="wl-${g.id}" class="pill" style="min-width:70px;text-align:center">${w==null?'Natural':w+'%'}</span><button class="sm" onclick="wpSet('${g.id}',null)">Natural</button></div></div>`}).join('')}</div>`;
 if(at==='se')h+=bgCard()+`<div class="card"><h2>Settings</h2>${[['notice','Announcement',DB.cfg.notice],['edge','House edge %',DB.cfg.edge],['signup','Signup coins',DB.cfg.signup],['daily','Daily bonus coins',DB.cfg.daily]].map(([k,l,v])=>`<div class="fld"><label>${l}</label><input value="${E(v)}" onchange="cf('${k}',this.value)"></div>`).join('')}<div class="row"><button class="d" onclick="wipe()">Reset all data</button></div><p class="mu">Admin username and password are set on the server (ADMIN_USER and ADMIN_PASSWORD). All data is stored on the server.</p></div>`;return h}
/* ---------- edit player ---------- */
function closeModal(){$('#modal').innerHTML='';ed=null}
function openEdit(id){const u=DB.users.find(x=>x.id===id);if(!u)return;ed={id};
 const hist=DB.tx.filter(t=>t.uid===id).slice(0,8);
 $('#modal').innerHTML=`<div class="ov" onclick="if(event.target===this)closeModal()"><div class="md"><div class="sec"><h2>Edit player</h2><button onclick="closeModal()">Close</button></div>
 <div class="fld"><label>Username</label><input id="eu" value="${E(u.username)}" autocapitalize="none"></div>
 <div class="fld"><label>Phone</label><input id="ep" value="${E(u.phone)}" inputmode="tel"></div>
 <div class="fld"><label>Email</label><input id="ee" value="${E(u.email)}" inputmode="email"></div>
 <div class="fld"><label>Coins (exact balance)</label><input id="ec" type="number" min="0" value="${R(u.bal)}"></div>
 <div id="merr" class="no"></div><div class="row"><button class="p" onclick="saveEdit()">Save details</button><button onclick="ban('${u.id}');closeModal()">${u.ban?'Unban':'Ban'} player</button></div>
 <hr style="border:0;border-top:1px solid var(--bd);margin:14px 0"><h3>Password</h3>
 <div class="pwbox" id="pwshow">Hidden</div><div class="row"><button onclick="viewPw()">👁 View password</button><button onclick="copyPw()">Copy</button></div>
 <div class="fld" style="margin-top:8px"><label>New password</label><input id="enp" placeholder="at least 6 characters" autocomplete="off"></div><div class="row"><button class="p" onclick="savePw()">Change password</button></div>
 <hr style="border:0;border-top:1px solid var(--bd);margin:14px 0"><h3>Recent activity</h3>${tbl(['Type','Coins','Note'],hist.map(t=>[t.type,(t.amt>0?'+':'')+R(t.amt),E(t.note)]))}</div></div>`}
async function saveEdit(){const d=await api('/admin/edit',{id:ed.id,username:$('#eu').value,phone:$('#ep').value,email:$('#ee').value,coins:$('#ec').value});if(!d.ok){$('#merr').textContent=d.err||'Could not save.';return}toast('Player saved');closeModal();sync()}
async function viewPw(){const d=await api('/admin/viewpw',{id:ed.id});$('#pwshow').textContent=d.ok?d.pw:(d.err||'Could not read it.')}
async function copyPw(){const t=$('#pwshow').textContent;try{await navigator.clipboard.writeText(t);toast('Copied')}catch(e){toast('Copy not allowed here')}}
async function savePw(){const d=await api('/admin/setpw',{id:ed.id,pw:$('#enp').value});if(!d.ok){$('#merr').textContent=d.err||'Could not change.';return}$('#merr').textContent='';$('#enp').value='';$('#pwshow').textContent='Hidden';toast('Password changed');sync()}
function applyBg(){const r=document.documentElement;if(!r||!r.style)return;const own=ses&&DB.cfg&&DB.cfg.bgv!==undefined,c=own?DB.cfg:TH;if(own)TH={bgv:c.bgv,bgo:c.bgo};
 if(c.bgv){r.style.setProperty('--bgimg','url(/bg?v='+c.bgv+')');r.classList.add('hasbg')}else{r.style.removeProperty('--bgimg');r.classList.remove('hasbg')}r.style.setProperty('--bgo',(c.bgo==null?55:c.bgo)/100)}
function setOvl(v){TH.bgo=+v;DB.cfg.bgo=+v;applyBg()}
async function pickBg(inp){const f=inp.files&&inp.files[0];if(!f)return;if(!/^image\//.test(f.type))return toast('Please choose an image file');toast('Processing image...');
 const url=URL.createObjectURL(f),img=new Image();await new Promise(ok=>{img.onload=ok;img.onerror=ok;img.src=url});URL.revokeObjectURL(url);
 if(!img.width)return toast('Could not read this image');
 const s=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
 let q=.85,data=c.toDataURL('image/jpeg',q);while(data.length>1.3e6&&q>.35){q-=.1;data=c.toDataURL('image/jpeg',q)}
 const d=await api('/admin/bg',{data});if(!d.ok)return toast(d.err||'Upload failed');toast('Background updated');await sync()}
const resetBg=()=>{if(confirm('Go back to the default background?'))adm('/admin/bgreset',{})};
const bgCard=()=>{const c=DB.cfg;return`<div class="card"><h2>Background image</h2><p class="mu">Shown behind every page for all players. JPG, PNG or WebP. Large images are resized automatically.</p><div class="bgprev" style="${c.bgv?`background-image:url(/bg?v=${c.bgv})`:''}">${c.bgv?'':'Default background'}</div><div class="row"><input id="bgfile" type="file" accept="image/*" style="flex:1;min-width:180px" onchange="pickBg(this)"><button class="d" onclick="resetBg()">Reset to default</button></div><div class="fld" style="margin-top:8px"><label>Image dimming (keeps text readable): <b id="bgol">${c.bgo}%</b></label><input type="range" min="0" max="90" value="${c.bgo}" oninput="document.getElementById('bgol').textContent=this.value+'%';setOvl(this.value)" onchange="cf('bgo',this.value)"></div></div>`};
function render(){applyBg();$('#app').innerHTML=!ready?'<p class="mu">Loading...</p>':!ses?authH():(ses.role==='admin'&&view==='admin')?adminH():userH()}
api('/theme').then(t=>{if(t&&t.bgv!==undefined&&!ses){TH={bgv:t.bgv,bgo:t.bgo};applyBg()}});setInterval(live,3000);document.addEventListener('visibilitychange',live);window.addEventListener('focus',live);
sync();
</script></body></html>
